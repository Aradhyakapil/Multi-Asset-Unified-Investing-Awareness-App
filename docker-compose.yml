version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wealthwise-postgres
    environment:
      POSTGRES_DB: wealthwise
      POSTGRES_USER: wealthwise
      POSTGRES_PASSWORD: wealthwise_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthwise"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wealthwise-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
